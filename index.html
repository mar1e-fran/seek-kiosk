<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEEK Kiosk</title>
<meta name="description" content="Interactive prototype of SEEK, an office wayfinding kiosk: explore the building, drop into a floor, and find what's happening today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/myf3ict.css">
<link href="https://fonts.googleapis.com/css2?family=Akatab:wght@400;600;700;900&display=swap" rel="stylesheet">
<script>
  /* ?embed=1 → transparent page so the host's background shows through; ?theme=dark|light → match the host */
  (function () {
    var q = new URLSearchParams(location.search), r = document.documentElement;
    var t = q.get('theme'); if (t === 'dark' || t === 'light') r.setAttribute('data-theme', t);
    if (q.get('embed') === '1') r.classList.add('embed');
  })();
</script>
<style>
html.embed, html.embed body { background: transparent; }
/* ── Page tokens (the frame around the kiosk) ─────────────────────────── */
:root {
  --page: #e8ecf2;
  --page-glow: #f7f9fc;
  --ink: #0f172a;
  --muted: #5b6474;
  --chip: rgba(15, 23, 42, .06);
  --bezel: #0d1117;
  --bezel-edge: #232a36;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0a0d13; --page-glow: #151a24; --ink: #e8edf6; --muted: #8b95a7;
    --chip: rgba(255, 255, 255, .07); --bezel: #000; --bezel-edge: #2a3140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0a0d13; --page-glow: #151a24; --ink: #e8edf6; --muted: #8b95a7;
  --chip: rgba(255, 255, 255, .07); --bezel: #000; --bezel-edge: #2a3140;
  color-scheme: dark;
}

/* ── Kiosk design tokens (from the Figma file) ────────────────────────── */
.screen {
  --primary1: #0f172a;
  --primary3: #b3d0ff;
  --primary4: #f1f5f9;
  --tile: #dbe8fb;
  --secondary2: #fe8a01;

  /* motion */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-inout: cubic-bezier(.65, 0, .35, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --t-build: 1100ms;
  --t-morph: 950ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--page-glow), var(--page) 70%);
  background-color: var(--page);
  color: var(--ink);
  font-family: "Akatab", system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [role="button"]:focus-visible { outline: 6px solid var(--secondary2, #fe8a01); outline-offset: 6px; }

/* ── Embed shell ──────────────────────────────────────────────────────── */
.shell {
  height: 100%;
  display: grid;
  grid-template-rows: 1fr auto;
  justify-items: center;
  align-items: center;
  padding: 16px 16px 12px;
  gap: 12px;
}
.fit { position: relative; width: 100%; height: 100%; display: grid; place-items: center; min-height: 0; }
.device-slot { position: relative; }

.device {
  position: absolute; left: 0; top: 0;
  width: 565px; height: 924px;
  padding: 20px;
  border-radius: 30px;
  background: linear-gradient(160deg, var(--bezel-edge), var(--bezel) 30%);
  box-shadow:
    0 0 0 1.5px var(--bezel-edge) inset,
    0 30px 60px -15px rgba(15, 23, 42, .45),
    0 10px 20px -10px rgba(15, 23, 42, .35);
  transform-origin: 0 0;
}
.device::after { /* glass sheen */
  content: ""; position: absolute; inset: 20px; border-radius: 12px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.07), rgba(255,255,255,0) 38%);
}


.caption {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  font-size: 14px; line-height: 1.3; color: var(--muted);
  min-height: 32px;
}
.caption .brand { font-weight: 900; letter-spacing: .08em; color: var(--ink); }
.caption .hint {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--ink);
  transition: opacity .25s ease;
}
.caption .hint::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fe8a01;
  box-shadow: 0 0 0 0 rgba(254, 138, 1, .5); animation: ping 1.8s ease-out infinite;
}
.caption .hint.swap { opacity: 0; }
.caption .restart {
  padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: 14px;
  transition: background .2s ease, color .2s ease;
}
.caption .restart:hover { background: var(--chip); color: var(--ink); }
.caption .restart:focus-visible { outline: 2px solid #fe8a01; outline-offset: 2px; }
/* Embedded on mariecabibihan.com: match the portfolio's quiet, typographic captions */
html.embed .caption { font-family: "neue-haas-grotesk-text", "Helvetica Neue", system-ui, sans-serif; font-size: 14px; letter-spacing: 0; gap: 16px; -webkit-font-smoothing: antialiased; }
html.embed .caption .brand { display: none; }
html.embed .caption .hint { padding: 0; background: none; color: var(--muted); border-radius: 0; }
html.embed .caption .hint::before { display: none; }
html.embed .caption .restart { padding: 0; border-radius: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
html.embed .caption .restart:hover { background: none; text-decoration-color: transparent; }
html.embed .caption .restart:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(254,138,1,.55); } 80%, 100% { box-shadow: 0 0 0 8px rgba(254,138,1,0); } }


/* ── The kiosk screen: 2100 × 3536 design units ───────────────────────── */
.screen {
  position: relative;
  width: 525px; height: 884px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--primary4);
  isolation: isolate;
  user-select: none;
  font-family: "Akatab", system-ui, sans-serif;
  color: #000;
}
.screen.instant, .screen.instant * { transition: none !important; }

.abs { position: absolute; }

/* Logo */
.logo {
  position: absolute; left: 420.25px; top: 25.25px; width: 66px; height: 66px; z-index: 12;
  border-radius: 50%;
  transition: transform .7s var(--ease-out);
}
.logo img { width: 66px; height: 66px; display: block; transition: transform .6s var(--spring); }
.logo:active img { transform: scale(.92) rotate(-12deg); }
.screen[data-view="plan"] .logo { transform: translateY(5px); }
.screen[data-view="idle"] .logo img { animation: logo-spin 14s linear infinite; }
@keyframes logo-spin { to { transform: rotate(360deg); } }

/* ── Building stage (Figma "Frame 37": 1682 × 2373 at 209, 496) ───────── */
.stage {
  position: absolute; left: 52.25px; top: 124px; width: 420.5px; height: 593.25px;
  /* clip only what leaves through the top edge, like the Figma frame */
  clip-path: inset(0 -500px -500px -500px);
  transition: transform .8s var(--ease-sheet), filter .6s ease;
  z-index: 2;
}
.float { position: absolute; inset: 0; }
.screen[data-view="idle"] .float { animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-4.5px); } }

.layer { position: absolute; inset: 0; pointer-events: none; }
.level, .roof, .glass, .furn, .mini-pins {
  transition:
    transform var(--t-build) var(--ease-inout),
    opacity calc(var(--t-build) * .6) ease,
    translate .9s cubic-bezier(.34, 1.45, .64, 1);
}
/* affordance: in idle the floors periodically ease apart (a preview of the
   explode), and do so on hover/press, so the building itself reads as touchable */
.screen[data-view="idle"]:is(.peek, .peek-hold) .L3 { translate: 0 -13.5px; }
.screen[data-view="idle"]:is(.peek, .peek-hold) .L1 { translate: 0 13.5px; }
.screen[data-view="idle"]:is(.peek, .peek-hold) .roof { translate: 0 -30px; }
.screen[data-view="idle"]:is(.peek, .peek-hold) .glass { translate: calc(var(--dx) * .07) calc(var(--dy) * .07); opacity: .55; }
.float { scale: 1; transition: scale .25s var(--ease-out); }
.screen[data-view="idle"].press .float { scale: .975; }

/* iso slab: wrapper box from Figma, inner element carries the isometric transform */
.slab-box { position: absolute; left: 5.75px; width: 396.048px; height: 265.109px; display: flex; align-items: center; justify-content: center; }
.slab {
  position: relative; flex: none; width: 215.81px; height: 260.779px;
  transform: rotate(-33.69deg) skewX(22.42deg) scale(1, .92);
  transition: transform var(--t-morph) var(--ease-inout);
  pointer-events: none;
}
.slab img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.slab .tint { opacity: 0; transition: opacity calc(var(--t-morph) * .7) ease calc(var(--t-morph) * .3); }
.slab-hit { position: absolute; inset: 0; border-radius: 1.5px; cursor: pointer; }

.L3 .slab-box { top: 7.3375px; }
.L2 .slab-box { top: 163.945px; }
.L1 .slab-box { top: 320.555px; }
.roof .slab-box { left: 5.915px; top: -268.983px; }

/* glass walls (idle positions; explode pushes them out) */
.gw { position: absolute; display: flex; align-items: center; justify-content: center; }
.gw > div { flex: none; position: relative; }
.gw .pane { background: rgba(199, 199, 199, .12); border: 0.25px solid #000; }
.gw img { position: absolute; display: block; max-width: none; }
.tL { transform: rotate(-33.69deg) skewX(-33.69deg) scale(1, .83); }
.tR { transform: rotate(33.69deg) skewX(33.69deg) scale(1, -.83); }

/* mini pins (exploded view) */
.mini-pin {
  position: absolute; width: 44.75px; height: 46.25px; pointer-events: none;
  transform-origin: 22.5px 46.25px;
  transition: transform .55s var(--spring), opacity .3s ease;
}
.mini-pin img { position: absolute; left: 6.3px; top: 0; width: 32.5px; height: 46.25px; filter: drop-shadow(0 1.5px 2.5px rgba(15,23,42,.18)); }
.mini-pin span { position: absolute; left: 22.55px; top: 16.25px; width: 1em; height: 1em; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }

/* ── View: idle (stacked building) ── */
.screen[data-view="idle"] .L3 { transform: translate(6.3925px, 115.615px); }
.screen[data-view="idle"] .L2 { transform: translate(6.3925px, 0.365px); }
.screen[data-view="idle"] .L1 { transform: translate(6.3925px, -114.885px); }
.screen[data-view="idle"] .roof { transform: translate(6.395px, 365.205px); }
.screen[data-view="idle"] .L3 .furn { transform: translate(-1.3925px, 0.73px); }
.screen[data-view="idle"] .L2 .furn,
.screen[data-view="idle"] .L1 .furn { opacity: 0; }
.screen[data-view="idle"] .mini-pin { opacity: 0; transform: scale(.4); transition-delay: 0s !important; }

/* choreography: walls leave before the floors split; floors close before walls return */
.screen[data-from="idle"][data-view="explore"] .level { transition-delay: 140ms; }
.screen[data-from="idle"][data-view="explore"] .roof { transition-delay: 60ms; }
.screen[data-view="idle"] .glass { transition-delay: 380ms; }
.screen[data-view="idle"] .roof { transition-delay: 200ms; }

/* ── View: explore (exploded floors) ── */
.screen:not([data-view="idle"]) .roof { opacity: 0; }
.screen:not([data-view="idle"]) .glass { opacity: 0; transform: translate(var(--dx), var(--dy)); }
.screen[data-view="explore"] .slab-hit,
.screen[data-view="explore"] .mini-pin { pointer-events: auto; cursor: pointer; }
.screen[data-view="explore"] .level.hot { transform: translateY(-5.5px); transition-duration: .45s; transition-delay: 0ms; transition-timing-function: var(--ease-out); }
.screen[data-view="explore"] .level.hot .slab { filter: brightness(1.06) drop-shadow(0 7.5px 10px rgba(15, 23, 42, .18)); }
.screen[data-view="explore"] .mini-pin:hover { transform: translateY(-2.5px) scale(1.06); }
.screen[data-view="explore"] .mini-pin:active { transform: scale(.9); transition-duration: .12s; }
.screen[data-view="explore"] .mini-pin { transition-delay: var(--pd, 0ms); }

.building-hit { position: absolute; left: 57.5px; top: 95px; width: 315px; height: 380px; cursor: pointer; display: none; }
.screen[data-view="idle"] .building-hit { display: block; }

/* ── View: plan (one floor flattened) ── */
.screen[data-view="plan"] .level:not(.is-selected) { opacity: 0; }
.screen[data-view="plan"] .level.is-above { transform: translateY(-105px); }
.screen[data-view="plan"] .level.is-below { transform: translateY(105px); }
.screen[data-view="plan"] .level .furn,
.screen[data-view="plan"] .level .mini-pins { opacity: 0; transition-duration: .35s; }
.screen[data-view="plan"] .level.is-selected .slab { transform: rotate(0deg) skewX(0deg) scale(1.718, 1.718); }
.screen[data-view="plan"] .level.is-selected .tint { opacity: 1; }
.screen[data-view="plan"] .L3.is-selected { transform: translate(6.45px, 156.857px); }
.screen[data-view="plan"] .L2.is-selected { transform: translate(6.45px, 0.305px); }
.screen[data-view="plan"] .L1.is-selected { transform: translate(6.45px, -156.36px); }

/* floor rail (exploded view labels) */
.rail { position: absolute; left: 36.25px; top: 203.75px; width: 25.5px; z-index: 5; display: flex; flex-direction: column; gap: 131px; }
.rail button {
  width: 25.5px; height: 25.5px; border-radius: 2.5px; background: #fff;
  font-weight: 700; font-size: 15.5px; letter-spacing: -0.31px; line-height: 1.32;
  display: grid; place-items: center;
  box-shadow: 0 1.5px 4.5px rgba(15, 23, 42, .06);
  opacity: 0; transform: translateX(-10px);
  transition: opacity .5s ease, transform .6s var(--ease-out), background .25s ease;
  pointer-events: none;
}
.rail button.on { background: var(--secondary2); }
.screen[data-view="explore"] .rail button { opacity: 1; transform: none; pointer-events: auto; transition-delay: calc(500ms + var(--i) * 70ms), calc(500ms + var(--i) * 70ms), 0ms; }

/* ── Plan layer ── */
.plan { position: absolute; left: 52.25px; top: 124px; width: 420.5px; height: 593.25px; overflow: clip; z-index: 3; pointer-events: none; }
.plan > * { opacity: 0; transition: opacity .45s ease; }
.screen[data-view="plan"] .plan { pointer-events: auto; }
.screen[data-view="plan"] .plan > * { opacity: 1; transition-delay: calc(var(--t-morph) * .82); }
.plan .plan-building { position: absolute; left: -134.25px; top: -268.983px; width: 709px; height: 872.399px; display: block; max-width: none; }
.plan .rooms { position: absolute; left: 36.415px; top: 79.935px; width: 336.321px; height: 428.226px; }
.plan .rooms img { position: absolute; left: -6.375px; top: -6.375px; width: 349.07px; height: 440.975px; display: block; max-width: none; }
.plan .content { position: absolute; inset: 0; transition: opacity .35s ease, transform .5s var(--ease-out); }
.plan .content.leaving { opacity: 0; transform: translateY(var(--shift, 0)); }
.plan-bg { position: absolute; inset: 0; }

/* large pins */
.pin {
  position: absolute; width: 53.75px; height: 57.5px; cursor: pointer;
  transform-origin: 27px 56px;
  transition: transform .5s var(--spring), opacity .25s ease;
}
.pin img { position: absolute; left: 7.55px; top: 0; width: 39px; height: 56px; filter: drop-shadow(0 2.5px 4px rgba(15, 23, 42, .16)); }
.pin span { position: absolute; left: 27.05px; top: 19.5px; width: 1em; height: 1em; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-size: 21px; line-height: 1; }
.pin:hover { transform: translateY(-3px); }
.pin:active { transform: scale(.92); transition-duration: .12s; }
.pin.hidden { opacity: 0; transform: scale(.5); pointer-events: none; }
.pin.enter { animation: drop .7s var(--spring) both; animation-delay: var(--pd, 0ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-40px) scale(.7); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }

/* event popover card (Figma "event / details_right" + "detail_left") */
.card {
  position: absolute; z-index: 10;
  transform: scale(.2); opacity: 0;
  transition: transform .55s var(--spring), opacity .2s ease;
  pointer-events: none;
}
.card.open { transform: none; opacity: 1; pointer-events: auto; }
.card.right { width: 286.5px; height: 221.75px; transform-origin: 2.375px 20.5px; }
.card.left { width: 171px; height: 221.75px; transform-origin: 38.375px 34.65px; }
.card .bubble { position: absolute; display: block; max-width: none; }
.card.right .bubble { left: -4.3675px; top: 11.56px; width: 297.25px; height: 181.5px; }
.card.left .bubble { left: -246.625px; top: 27.8925px; width: 292.25px; height: 187.713px; }
.card .body {
  position: absolute; width: 239.5px; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; gap: 14.25px; align-items: flex-end;
}
.card.right .body { left: 146.75px; top: 100.375px; }
.card.left .body { left: -100.5px; top: 122.875px; }
.card .body { gap: 3.75px; }
.card .x {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary4);
  display: grid; place-items: center; transition: background .2s ease, transform .2s var(--ease-out);
}
.card .x svg { width: 11px; height: 11px; }
.card .x:active { transform: scale(.9); background: var(--tile); }
.card .faces { width: 100%; display: grid; }
.card .faces > * { grid-area: 1 / 1; transition: opacity .3s ease, transform .45s var(--ease-out); }
.card .info { display: flex; flex-direction: column; gap: 9px; padding-top: 2px; }
.card .info .desc { margin-top: -3.5px; }
.card .tile { height: 40px; }
.host { display: flex; align-items: center; gap: 5.5px; }
.host .av {
  flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 8px; letter-spacing: -0.125px; color: #fff;
}
.host .who { display: flex; flex-direction: column; line-height: 1.2; }
.host .by { font-weight: 600; font-size: 6.5px; color: rgba(15, 23, 42, .55); }
.host .name { font-weight: 700; font-size: 9px; letter-spacing: -0.15px; color: var(--primary1); }
.host .name span { font-weight: 400; color: rgba(15, 23, 42, .62); }
.card .qr-face { display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(6px); pointer-events: none; }
.card.show-qr .info { opacity: 0; transform: translateY(-6px); pointer-events: none; }
.card.show-qr .qr-face { opacity: 1; transform: none; pointer-events: auto; transition-delay: .12s; }
.qr { width: 84px; height: 84px; clip-path: inset(0 0 100% 0); transition: clip-path .7s var(--ease-inout) .2s; }
.card.show-qr .qr { clip-path: inset(0 0 0 0); }
.qr svg { width: 100%; height: 100%; display: block; }
.scan {
  margin-top: 9px; width: 133.75px; height: 14.75px; border-radius: 3.663px; background: var(--tile);
  display: grid; place-items: center; font-size: 8.75px; letter-spacing: -0.175px; line-height: 1.32; color: var(--primary1);
}
.card .title-row { width: 100%; display: flex; gap: 7.5px; align-items: center; font-size: 25px; }
.card .title-row .em { font-weight: 700; letter-spacing: -0.5px; line-height: 1.32; }
.card .title-row h3 { margin: 0; font-weight: 900; line-height: .87; text-transform: capitalize; flex: 1; min-width: 0; font-size: 25px; white-space: nowrap; }
.card .desc { margin: 0; font-weight: 600; font-size: 7.5px; letter-spacing: -0.15px; line-height: 1.32; }
.card .tiles { width: 100%; display: flex; gap: 25.25px; }
.tile {
  background: var(--tile); border-radius: 3.663px; height: 44.25px; width: 107px;
  padding: 2.997px 4.329px; display: flex; flex-direction: column; gap: 1.25px;
  color: var(--primary1);
}
.tile + .tile { width: 106.75px; gap: 0.5px; }
.tile .label { display: flex; align-items: center; gap: 1.998px; font-weight: 700; font-size: 8.25px; letter-spacing: -0.165px; line-height: 1.32; }
.tile .label img { width: 8px; height: 8px; display: block; }
.tile .value { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13.25px; letter-spacing: -0.265px; line-height: 1.32; white-space: nowrap; padding-right: 0; }
.tile .value.lg { font-size: 16.25px; letter-spacing: -0.325px; }
.join {
  width: 239.5px; height: 26.25px; border-radius: 3.663px; background: var(--primary3);
  font-size: 13.75px; letter-spacing: -0.275px; line-height: 1.32; color: var(--primary1);
  display: grid; place-items: center;
  transition: background .3s ease, transform .2s var(--ease-out);
}
.join:hover { background: #a4c6ff; }
.join:active { transform: scale(.985); }


/* plan chrome */
.chip-floor {
  position: absolute; left: 26.75px; top: 28.5px; width: 141.75px; height: 66px; z-index: 6;
  background: var(--primary3); border-radius: 2.5px; display: grid; place-items: center;
  font-weight: 700; font-size: 50px; letter-spacing: -1px; line-height: 1.32;
}
.stack { position: absolute; left: 26.75px; top: 107.75px; width: 66px; height: 66px; z-index: 6; isolation: isolate; }
.stack .sq {
  position: absolute; inset: 0; border-radius: 2.5px; background: var(--primary3);
  display: grid; place-items: center; font-weight: 700; font-size: 50px; letter-spacing: -1px; line-height: 1.32;
  transition: transform .6s var(--ease-out), background .3s ease, box-shadow .3s ease;
}
.stack .sq.top { background: var(--secondary2); z-index: 3; }
.stack:hover .sq:not(.top):nth-child(n) { box-shadow: 0 2.5px 7.5px rgba(15,23,42,.08); }
.stack:hover .sq.d1 { transform: translate(5.5px, 5.5px); }
.stack:hover .sq.d2 { transform: translate(11px, 11px); }
.stack .sq.d1 { z-index: 2; }
.stack .sq.d2 { z-index: 1; }
.pager {
  position: absolute; left: 50%; top: 712.5px; width: 337.5px; padding: 2.5px; z-index: 6;
  transform: translateX(-50%);
  display: flex; gap: 11.75px; align-items: center; justify-content: center;
}
.pager button {
  width: 33.25px; height: 33.25px; background: var(--primary3);
  font-weight: 700; font-size: 25px; letter-spacing: -0.5px; line-height: 1.32;
  display: grid; place-items: center; padding-top: 1.5px;
  transition: background .3s ease, transform .3s var(--spring);
}
.pager button:hover { transform: translateY(-1.5px); }
.pager button.on { background: var(--secondary2); }

.plan-ui { opacity: 0; pointer-events: none; transition: opacity .4s ease, transform .6s var(--ease-out); }
.chip-floor.plan-ui, .stack.plan-ui { transform: translateX(-15px); }
.pager.plan-ui { transform: translate(-50%, 15px); }
.screen[data-view="plan"] .plan-ui { opacity: 1; pointer-events: auto; transform: none; transition-delay: calc(var(--t-morph) * .7); }
.screen[data-view="plan"] .pager.plan-ui { transform: translateX(-50%); }

/* ── On-screen guidance (a kiosk has no caption bar) ── */
.heading {
  position: absolute; left: 26.75px; top: 28.5px; height: 66px; padding: 0 16px; z-index: 6;
  background: var(--primary3); border-radius: 2.5px; display: flex; align-items: center;
  font-weight: 700; font-size: 37.5px; letter-spacing: -0.75px; line-height: 1.32;
  opacity: 0; transform: translateX(-15px); pointer-events: none;
  transition: opacity .4s ease, transform .6s var(--ease-out);
}
.screen[data-view="explore"] .heading { opacity: 1; transform: none; transition-delay: .55s; }

/* pager lead tile: back to the 3D building */
.pager .to3d { background: var(--primary1); }
.pager .to3d svg { width: 19px; height: 19px; }
.pager .sep { width: 1px; height: 24px; border-radius: 0.5px; background: rgba(15, 23, 42, .14); margin: 0 -2.5px; }
.pager button:active, .rail button:active { transform: scale(.94); transition-duration: .12s; }

.still {
  position: absolute; left: 50%; top: 730px; z-index: 40;
  display: flex; align-items: center; gap: 10px; padding: 7.5px 7.5px 7.5px 16px; border-radius: 249.75px;
  background: var(--primary1); color: #fff; font-weight: 600; font-size: 13px; line-height: 1.32; white-space: nowrap;
  box-shadow: 0 7.5px 20px -5px rgba(15, 23, 42, .5);
  transform: translate(-50%, 15px); opacity: 0; pointer-events: none;
  transition: opacity .35s ease, transform .5s var(--spring);
}
.still.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.still button { padding: 5.5px 12px; border-radius: 249.75px; background: var(--secondary2); color: #000; font-weight: 700; font-size: 12px; }
.still b { font-variant-numeric: tabular-nums; }

/* ── Events of the Day: sheet + scrim ─────────────────────────────────── */
.scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(0, 0, 0, .2);
  backdrop-filter: blur(1.5125px); -webkit-backdrop-filter: blur(1.5125px);
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease;
}
.screen.sheet-open .scrim { opacity: 1; pointer-events: auto; cursor: pointer; }

.sheet {
  position: absolute; left: 0; top: 802px; width: 525px; height: 772px; z-index: 21;
  transform: translateY(var(--drag, 0px));
  transition: transform .8s var(--ease-sheet);
  touch-action: none;
}
.sheet.dragging { transition: none; }
.screen.sheet-open .sheet { transform: translateY(calc(-690px + var(--drag, 0px))); }
.sheet .bg {
  position: absolute; inset: 0; background: var(--primary3);
  border-radius: 34px 34px 0 0;
  box-shadow: 0 -5px 15px rgba(15, 23, 42, .06);
  transition: opacity .55s ease;
}
.sheet .peek { position: absolute; left: 0; top: 0; width: 100%; height: 82.5px; cursor: pointer; }
.sheet .handle {
  position: absolute; left: 221px; top: 11.25px; width: 81.75px; height: 6px; border-radius: 8.5px;
  background: var(--primary4); transition: opacity .3s ease, transform .3s ease;
}
.sheet .peek:hover .handle { transform: translateY(-1.5px); }
.sheet h2 {
  position: absolute; left: 49px; top: 29.5px; margin: 0;
  font-weight: 900; font-size: 30px; letter-spacing: -0.6px; line-height: 1.32; color: #fff; white-space: nowrap;
  transform-origin: 0 0;
  transition: transform .8s var(--ease-sheet);
}
.sheet-close {
  position: absolute; left: 438.5px; top: 30.5px; width: 37.5px; height: 37.5px; border-radius: 3.75px;
  background: var(--primary4); display: grid; place-items: center;
  opacity: 0; transform: translateY(7.5px); pointer-events: none;
  transition: opacity .3s ease, transform .5s var(--ease-out), background .2s ease;
}
.sheet-close svg { width: 17.5px; height: 17.5px; }
.screen.sheet-open .sheet-close { opacity: 1; transform: none; pointer-events: auto; transition-delay: .3s; }
.sheet-close:active { background: var(--tile); transform: scale(.94); transition-delay: 0s; }
.grid {
  position: absolute; left: 49px; top: 108.25px; width: 427.25px;
  display: grid; grid-template-columns: 173.75px 173.75px; justify-content: space-between; row-gap: 25.75px;
}
.ev {
  position: relative; width: 173.75px; height: 197px; text-align: left; cursor: pointer;
  transition: transform .45s var(--ease-out);
}
.screen.sheet-open .ev { animation: rise .8s var(--ease-sheet) both; animation-delay: calc(80ms + var(--i) * 45ms); }
@keyframes rise { from { transform: translateY(30px); } }
.ev .face {
  position: absolute; left: 0; top: 0; width: 173.5px; height: 197px;
  background: var(--primary4); border-radius: 3.75px; padding: 6.75px 9.5px;
  display: flex; flex-direction: column; gap: 10.5px; align-items: flex-start; padding-bottom: 5.5px;
  transition: box-shadow .35s ease, transform .35s var(--ease-out);
}
.ev:hover .face { box-shadow: 0 7.5px 15px -5px rgba(15, 23, 42, .25); transform: translateY(-2.5px); }
.ev:active .face { transform: translateY(-1px) scale(.99); }
.ev h4 { margin: 0; width: 126.25px; font-weight: 900; font-size: 20px; letter-spacing: -0.4px; line-height: 1.32; color: #000; }
.ev .tiles { width: 100%; height: 98px; display: flex; flex-direction: column; gap: 9.5px; align-items: center; justify-content: center; }
.ev .t {
  width: 145px; height: 44.25px; border-radius: 3.663px; background: var(--tile);
  display: grid; place-items: center; color: var(--primary1); line-height: 1.32;
}
.ev .t.time { font-size: 17.5px; letter-spacing: -0.35px; }
.ev .t.place { font-size: 16.25px; letter-spacing: -0.325px; }
.ev .where {
  margin-top: auto; align-self: stretch; display: flex; align-items: center; justify-content: space-between;
  font-weight: 700; font-size: 9px; letter-spacing: -0.125px; line-height: 1.32; color: rgba(15, 23, 42, .62);
}
.ev .where b { color: var(--primary1); font-weight: 700; }
.ev .em {
  position: absolute; left: 160.75px; top: 10.125px; transform: translate(-50%, -50%);
  font-weight: 900; font-size: 51px; letter-spacing: -1.02px; line-height: 1.32; white-space: nowrap;
  transition: transform .5s var(--spring);
}
.ev:hover .em { transform: translate(-50%, -58%) rotate(-8deg); }

/* phones: keep the motion that explains state (explode, plan morph, sheet slide, card pop),
   drop the decorative and always-running animations to save battery and GPU memory */
@media (pointer: coarse) and (max-width: 820px) {
  .screen[data-view="idle"] .logo img,
  .screen[data-view="idle"] .float,
  .caption .hint::before { animation: none; }
  .pin.enter { animation: none; }
  .screen.sheet-open .ev { animation: none; }
  .scrim { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(15, 23, 42, .32); }
}

/* reduced motion: keep state changes, drop travel */
.screen { touch-action: manipulation; -webkit-touch-callout: none; }
@media (hover: none) {
  .pin:hover, .pager button:hover, .sheet .peek:hover .handle, .stack:hover .sq { transform: none; }
  .ev:hover .face { transform: none; box-shadow: none; }
  .ev:hover .em { transform: translate(-50%, -50%); }
  .screen[data-view="explore"] .mini-pin:hover { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .screen { --t-build: 1ms; --t-morph: 1ms; }
  .screen *, .screen *::before { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
  .caption .hint::before { animation: none; }
}

<script>
(() => {
  // Design values are Figma px (2100 × 3536). The build renders the kiosk at K × that size so phones
  // never hold full-size layers in memory; every px written from script goes through K too.
  const K = 0.25;
  const W = 2260 * K, H = 3696 * K;
  const screen = document.getElementById('screen');
  const $ = (s, r = screen) => r.querySelector(s);
  const $$ = (s, r = screen) => [...r.querySelectorAll(s)];

  /* ── Data ─────────────────────────────────────────────────────────── */
  const EVENTS = {
    cookies:  { emoji: '😄', listEmoji: '🍪', title: 'Cooookiesss!', listTitle: 'Homemade Coooookies!', host: { name: 'Maya Okafor', role: 'Product Designer', color: '#fe8a01' }, desc: 'Grab some homemade cookies that can elevate your pitching skills', time: '9:30 AM', place: 'Room 307', floor: 3, plan: [922, 267], mini: [414.4, 23.85] },
    hotdogs:  { emoji: '🌭', title: 'Hot Dogs', host: { name: 'Daniel Reyes', role: 'Office Manager', color: '#01a4f8' }, desc: 'Extra New York Hot dogs here. Come grab one if you missed the breakfast.', time: '8:30 AM', place: '3rd floor cafe', placeSize: 60, floor: 3, plan: [1325, 452], mini: [853, 46] },
    rage:     { emoji: '😡', title: 'Rage baiting', host: { name: 'Sam Whitfield', role: 'Staff Engineer', color: '#0f172a' }, desc: 'Come try me!!', time: '7:30 PM', place: 'Room 305', floor: 3, plan: [1015, 1306], mini: [1140.19, 350.34] },
    movie:    { emoji: '🎥', title: 'Movie Night!', host: { name: 'Priya Nair', role: 'Social Committee Lead', color: '#fe8a01' }, desc: 'Star Wars The Last Jedi Tonight! Don’t forget popcorn and drinks!', time: '10:30 PM', place: 'Room 302', floor: 3, plan: [209, 1541], mini: [675.06, 660] },
    tea:      { emoji: '☕️', title: 'Tea time', host: { name: 'Hana Kim', role: 'People & Culture Partner', color: '#01a4f8' }, desc: 'Loose leaf, warm biscuits and ten quiet minutes before stand-up.', time: '7:30 AM', place: 'Room 205', floor: 2, plan: [1015, 1306] },
    birthday: { emoji: '🥳', title: 'Jiwan’s Birthday', host: { name: 'Leo Martins', role: 'Frontend Engineer, Jiwan’s team', color: '#fe8a01' }, desc: 'Cake in the lounge. Sign the card on your way in!', time: '7:30 PM', place: '2nd floor lounge', placeSize: 53, floor: 2, plan: [209, 1541] },
    kittens:  { emoji: '😹', title: 'Exploding Kittens', host: { name: 'Aisha Bello', role: 'QA Analyst', color: '#0f172a' }, desc: 'Card game showdown. Bring your best poker face and a defuse.', time: '3:30 PM', place: 'Room 214', floor: 2, plan: [540, 1090] },
    mario:    { emoji: '🎮', title: 'Mario Kart Finale!', listTitle: 'Mario Kart 8 Grand Finale!', host: { name: 'Tom Chen', role: 'Head of Platform', color: '#01a4f8' }, desc: 'Final four on the big screen. Blue shells are fair game.', time: '8:30 PM', place: 'Room 134', floor: 1, plan: [1015, 1306] },
  };
  const TODAY = ['tea', 'hotdogs', 'cookies', 'kittens', 'birthday', 'mario'];

  /* plan point → isometric point on a floor (same transform the slab uses) */
  const LEVEL_CENTER = { 3: [815.1, 559.57], 2: [815.1, 1186], 1: [815.1, 1812.44] };
  const PLAN_CENTER = [840.9, 1187], PLAN_SCALE = 1.718;
  function toIso(level, x, y) {
    let lx = (x - PLAN_CENTER[0]) / PLAN_SCALE, ly = (y - PLAN_CENTER[1]) / PLAN_SCALE;
    ly *= 0.92;                                        // scaleY
    lx += Math.tan(22.42 * Math.PI / 180) * ly;      // skewX
    const a = -33.69 * Math.PI / 180;                  // rotate
    const rx = lx * Math.cos(a) - ly * Math.sin(a), ry = lx * Math.sin(a) + ly * Math.cos(a);
    return [rx + LEVEL_CENTER[level][0], ry + LEVEL_CENTER[level][1]];
  }

  /* ── State ────────────────────────────────────────────────────────── */
  const state = { view: 'idle', floor: 3, event: null, sheet: false };

  /* ── Render: mini pins on the exploded floors ─────────────────────── */
  for (const level of [1, 2, 3]) {
    const host = $(`.L${level} .mini-pins`);
    Object.entries(EVENTS).filter(([, e]) => e.floor === level).forEach(([id, e], i) => {
      let [x, y] = e.mini || (() => { const [tx, ty] = toIso(level, e.plan[0] + 108.2, e.plan[1] + 224); return [tx - 90.2, ty - 185]; })();
      const el = document.createElement('div');
      el.className = 'mini-pin';
      el.style.cssText = `left:${x * K}px;top:${y * K}px;--pd:${650 + i * 70 + (3 - level) * 90}ms`;
      el.innerHTML = `<img src="assets/pin-small.svg" alt=""><span>${e.emoji}</span>`;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', e.title);
      el.addEventListener('click', ev => { ev.stopPropagation(); openPlan(level, id); });
      host.appendChild(el);
    });
  }

  /* ── Render: Events of the Day grid ───────────────────────────────── */
  const grid = $('#grid');
  TODAY.forEach((id, i) => {
    const e = EVENTS[id];
    const b = document.createElement('button');
    b.className = 'ev';
    b.style.setProperty('--i', i);
    b.innerHTML = `<div class="face"><h4>${e.listTitle || e.title}</h4><div class="tiles"><div class="t time">${e.time}</div><div class="t place">${e.place}</div></div><div class="where"><span>Floor <b>${e.floor}</b></span><span>Show on map →</span></div></div><div class="em" aria-hidden="true">${e.listEmoji || e.emoji}</div>`;
    b.addEventListener('click', () => { closeSheet(); setTimeout(() => openPlan(e.floor, id), 380); });
    grid.appendChild(b);
  });
  // keep tiles aligned across each row (Figma nudges single-line titles to match)
  document.fonts.ready.then(() => {
    const cards = $$('.ev h4', grid);
    for (let r = 0; r < cards.length; r += 2) {
      const pair = cards.slice(r, r + 2), h = Math.max(...pair.map(c => c.offsetHeight));
      pair.forEach(c => c.style.minHeight = h + 'px');
    }
  });

  /* ── Render: floor plan pins + popover card ───────────────────────── */
  const pinsHost = $('#pins');
  const BUBBLE = { left: 'assets/card-left.svg', right: 'assets/card-right.svg' };
  function cardHTML(id) {
    const e = EVENTS[id], side = e.plan[0] < 700 ? 'right' : 'left';
    return `<div class="card ${side}" data-card="${id}" style="left:${e.plan[0] * K}px;top:${e.plan[1] * K}px">
      <img class="bubble" src="${BUBBLE[side]}" alt="">
      <div class="body">
        <div class="title-row"><span class="em">${e.emoji}</span><h3>${e.title}</h3><button class="x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="faces">
          <div class="info">
            <div class="host"><span class="av" style="background:${e.host.color}">${e.host.name.split(' ').map(w => w[0]).join('')}</span><div class="who"><span class="by">Hosted by</span><span class="name">${e.host.name} <span>· ${e.host.role}</span></span></div></div>
            <p class="desc">${e.desc}</p>
            <div class="tiles">
              <div class="tile"><div class="label"><img src="assets/icon-calendar.svg" alt="">Time</div><div class="value">Feb 22, ${e.time}</div></div>
              <div class="tile"><div class="label"><img src="assets/icon-location.svg" alt="">Location</div><div class="value lg" style="${e.placeSize ? `font-size:${e.placeSize * K}px` : ''}">${e.place}</div></div>
            </div>
            <button class="join">Join</button>
          </div>
          <div class="qr-face">
            <div class="qr" role="img" aria-label="QR code: add ${e.title} to your calendar"></div>
            <div class="scan">Scan to add to your calendar</div>
          </div>
        </div>
      </div>
    </div>`;
  }
  function renderPlan(floor) {
    const ids = Object.keys(EVENTS).filter(id => EVENTS[id].floor === floor);
    pinsHost.innerHTML = ids.map((id, i) => {
      const e = EVENTS[id];
      return `<div class="pin enter" data-pin="${id}" role="button" tabindex="0" aria-label="${e.title}" style="left:${e.plan[0] * K}px;top:${e.plan[1] * K}px;--pd:${i * 80}ms"><img src="assets/pin-large.svg" alt=""><span>${e.emoji}</span></div>`;
    }).join('') + ids.map(cardHTML).join('');
    // one-line titles: step the size down until it fits the bubble
    $$('.card h3', pinsHost).forEach(h => {
      let size = 100;
      while (h.scrollWidth > h.clientWidth && size > 60) h.style.fontSize = (size -= 4) * K + 'px';
    });
  }
  pinsHost.addEventListener('click', ev => {
    const card = ev.target.closest('.card');
    if (ev.target.closest('.x')) { ev.stopPropagation(); showCard(null); return; }
    if (ev.target.closest('.join')) { ev.stopPropagation(); showQR(card); return; }
    if (ev.target.closest('.card')) { ev.stopPropagation(); return; }
    const pin = ev.target.closest('.pin');
    if (pin) { ev.stopPropagation(); showCard(pin.dataset.pin); }
  });
  pinsHost.addEventListener('keydown', ev => {
    const pin = ev.target.closest('.pin');
    if (pin && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); showCard(pin.dataset.pin); }
  });
  $('.plan').addEventListener('click', () => showCard(null));

  function showCard(id) {
    state.event = id;
    $$('.pin', pinsHost).forEach(p => { p.classList.remove('enter'); p.classList.toggle('hidden', p.dataset.pin === id); });
    $$('.card', pinsHost).forEach(c => {
      const open = c.dataset.card === id;
      if (!open && c.classList.contains('open')) setTimeout(() => c.classList.remove('show-qr'), 400);
      c.classList.toggle('open', open);
    });
    hint(id ? 'Tap Join to save it to your phone' : 'Tap a pin to see what’s on');
  }

  /* Join → a real QR code that opens an “add to calendar” link on the visitor's phone */
  function to24(t) {
    let [, h, m, ap] = t.match(/(\d+):(\d+)\s*(AM|PM)/);
    h = +h % 12 + (ap === 'PM' ? 12 : 0);
    return [h, +m];
  }
  function calendarURL(e) {
    const [h, m] = to24(e.time), pad = n => String(n).padStart(2, '0');
    const start = `20270222T${pad(h)}${pad(m)}00`, end = `20270222T${pad((h + 1) % 24)}${pad(m)}00`;
    const q = new URLSearchParams({ action: 'TEMPLATE', text: e.listTitle || e.title, dates: `${start}/${end}`, location: e.place, details: `${e.desc}\n\nHosted by ${e.host.name}, ${e.host.role}` });
    return 'https://calendar.google.com/calendar/render?' + q;
  }
  function qrSVG(text) {
    const q = qrcode(0, 'L'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="#0f172a"/></svg>`;
  }
  function showQR(card) {
    const box = $('.qr', card);
    if (!box.firstChild) box.innerHTML = qrSVG(calendarURL(EVENTS[card.dataset.card]));
    card.classList.add('show-qr');
    hint('Scan with your phone camera to add it to your calendar');
  }

  /* ── Views ────────────────────────────────────────────────────────── */
  function setFloorClasses(floor) {
    $$('.level').forEach(l => {
      const n = +l.dataset.level;
      l.classList.toggle('is-selected', n === floor);
      l.classList.toggle('is-above', n > floor);
      l.classList.toggle('is-below', n < floor);
    });
    $$('.rail button').forEach(b => b.classList.toggle('on', +b.dataset.go === floor));
    $$('.pager button[data-go]').forEach(b => b.classList.toggle('on', +b.dataset.go === floor));
    const order = [floor, ...[3, 2, 1].filter(n => n !== floor)];
    $$('.stack .sq').forEach(s => {
      const d = order.indexOf(+s.dataset.n);
      s.className = 'sq' + (d === 0 ? ' top' : ` d${d}`);
    });
    screen.dataset.floor = floor;
  }

  let fromTimer;
  function go(view) {
    screen.classList.remove('peek', 'peek-hold', 'press');
    screen.dataset.from = state.view;
    clearTimeout(fromTimer);
    fromTimer = setTimeout(() => delete screen.dataset.from, 1600);
    state.view = view;
    screen.dataset.view = view;
    $('.plan').setAttribute('aria-hidden', view !== 'plan');
    if (view === 'idle') hint('Tap the building to explore');
    if (view === 'explore') hint('Pick a floor, or tap a pin');
  }

  function openExplore() {
    showCard(null);
    $$('.level').forEach(l => l.classList.remove('hot'));
    go('explore');
  }

  function openPlan(floor, eventId) {
    if (state.view === 'plan') return switchFloor(floor, eventId);
    state.floor = floor;
    $$('.level').forEach(l => l.classList.remove('hot'));
    setFloorClasses(floor);
    renderPlan(floor);
    go('plan');
    hint('Tap a pin to see what’s on');
    if (eventId) setTimeout(() => showCard(eventId), 1250);
  }

  function switchFloor(floor, eventId) {
    if (floor === state.floor) { if (eventId) showCard(eventId); return; }
    const content = $('#planContent');
    const dir = floor > state.floor ? 1 : -1;
    content.style.setProperty('--shift', `${dir * 80 * K}px`);
    content.classList.add('leaving');
    setTimeout(() => {
      state.floor = floor;
      screen.classList.add('instant');
      setFloorClasses(floor);
      void screen.offsetWidth;
      screen.classList.remove('instant');
      renderPlan(floor);
      content.style.setProperty('--shift', `${-dir * 80 * K}px`);
      void content.offsetWidth;
      content.classList.remove('leaving');
      if (eventId) setTimeout(() => showCard(eventId), 650);
    }, 260);
  }

  function goHome() {
    closeSheet();
    showCard(null);
    go('idle');
  }

  /* ── Sheet (tap or drag) ──────────────────────────────────────────── */
  const sheet = $('#sheet');
  function openSheet() { state.sheet = true; screen.classList.add('sheet-open'); hint('Tap an event to see it on the map'); }
  function closeSheet() {
    if (!state.sheet) return;
    state.sheet = false; screen.classList.remove('sheet-open');
    hint(state.view === 'idle' ? 'Tap the building to explore' : state.view === 'explore' ? 'Pick a floor, or tap a pin' : 'Tap a pin to see what’s on');
  }
  let drag = null;
  sheet.addEventListener('pointerdown', e => {
    if (state.sheet && e.target.closest('.ev')) return;
    drag = { y: e.clientY, t: performance.now(), dy: 0, moved: false, id: e.pointerId };
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const k = scale || 1;
    drag.dy = (e.clientY - drag.y) / k;
    if (!drag.moved && Math.abs(drag.dy) > 12) { drag.moved = true; sheet.classList.add('dragging'); }
    if (!drag.moved) return;
    const min = state.sheet ? 0 : -2760 * K, max = state.sheet ? 2760 * K : 0;
    let d = Math.max(min, Math.min(max, drag.dy));
    if (drag.dy > max) d = max + (drag.dy - max) * .2;           // rubber band
    if (drag.dy < min) d = min + (drag.dy - min) * .2;
    sheet.style.setProperty('--drag', d + 'px');
  });
  window.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { dy, moved, t } = drag; drag = null;
    sheet.classList.remove('dragging');
    sheet.style.setProperty('--drag', '0px');
    if (!moved) return;
    sheet.dataset.justDragged = '1'; setTimeout(() => delete sheet.dataset.justDragged, 50);
    const v = dy / Math.max(1, performance.now() - t);              // design px per ms
    if (!state.sheet && (dy < -500 * K || v < -1.2 * K)) openSheet();
    else if (state.sheet && (dy > 500 * K || v > 1.2 * K)) closeSheet();
  });
  $('#peek').addEventListener('click', () => { if (!sheet.dataset.justDragged) state.sheet ? closeSheet() : openSheet(); });
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#peek').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
  $('#scrim').addEventListener('click', closeSheet);

  /* ── Wiring ───────────────────────────────────────────────────────── */
  const hit = $('.building-hit');
  hit.addEventListener('click', openExplore);
  hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openExplore(); } });
  hit.addEventListener('pointerenter', e => e.pointerType === 'mouse' && screen.classList.add('peek-hold'));
  hit.addEventListener('pointerleave', () => screen.classList.remove('peek-hold', 'press'));
  hit.addEventListener('pointerdown', () => screen.classList.add('press', 'peek-hold'));
  window.addEventListener('pointerup', () => screen.classList.remove('press'));
  // every few seconds on the attract screen the floors ease apart and settle back
  setInterval(() => {
    if (state.view !== 'idle' || state.sheet || screen.classList.contains('peek-hold')) return;
    screen.classList.add('peek');
    setTimeout(() => screen.classList.remove('peek'), 1100);
  }, 4200);

  $$('.level').forEach(l => {
    const n = +l.dataset.level, slab = $('.slab-hit', l);
    slab.addEventListener('click', () => openPlan(n));
    const on = () => { if (state.view !== 'explore') return; l.classList.add('hot'); $$('.rail button').forEach(b => b.classList.toggle('on', +b.dataset.go === n)); };
    const off = () => { l.classList.remove('hot'); $$('.rail button').forEach(b => b.classList.toggle('on', +b.dataset.go === state.floor)); };
    slab.addEventListener('pointerenter', on); slab.addEventListener('pointerleave', off);
    $$('.mini-pin', l).forEach(p => { p.addEventListener('pointerenter', on); p.addEventListener('pointerleave', off); });
  });
  $$('.rail button').forEach(b => {
    const l = $(`.L${b.dataset.go}`);
    b.addEventListener('click', () => openPlan(+b.dataset.go));
    b.addEventListener('pointerenter', () => state.view === 'explore' && l.classList.add('hot'));
    b.addEventListener('pointerleave', () => l.classList.remove('hot'));
  });
  $$('.pager button[data-go]').forEach(b => b.addEventListener('click', () => { showCard(null); switchFloor(+b.dataset.go); }));
  $('#stack').addEventListener('click', openExplore);
  $('#logo').addEventListener('click', goHome);
  document.getElementById('restart').addEventListener('click', goHome);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.sheet) closeSheet();
    else if (state.event) showCard(null);
    else if (state.view === 'plan') openExplore();
    else if (state.view === 'explore') goHome();
  });

  // kiosk behaviour: warn after 50s alone, then return to the attract screen
  const still = $('#still'), stillN = $('#stillN');
  let idleTimer, countdown;
  const poke = () => {
    clearTimeout(idleTimer); clearInterval(countdown); still.classList.remove('show');
    idleTimer = setTimeout(() => {
      if (state.view === 'idle' && !state.sheet) return;
      let n = 10; stillN.textContent = n; still.classList.add('show');
      countdown = setInterval(() => {
        stillN.textContent = --n;
        if (n <= 0) { clearInterval(countdown); still.classList.remove('show'); goHome(); }
      }, 1000);
    }, 50000);
  };
  ['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, poke, { passive: true }));
  poke();
  screen.addEventListener('contextmenu', e => e.preventDefault());
  $('#back').addEventListener('click', openExplore);

  /* ── Caption hint ─────────────────────────────────────────────────── */
  const hintEl = document.getElementById('hint');
  let hintText = hintEl.textContent;
  function hint(t) {
    if (t === hintText) return;
    hintText = t;
    hintEl.classList.add('swap');
    setTimeout(() => { hintEl.textContent = t; hintEl.classList.remove('swap'); }, 180);
  }

  /* ── Fit the 2100 × 3536 kiosk into whatever box embeds it ────────── */
  const fit = document.getElementById('fit'), slot = document.getElementById('slot'), device = document.getElementById('device');
  let scale = 1;
  function resize() {
    const r = fit.getBoundingClientRect();
    scale = Math.min(r.width / W, r.height / H);
    device.style.transform = `scale(${scale})`;
    slot.style.width = W * scale + 'px';
    slot.style.height = H * scale + 'px';
  }
  new ResizeObserver(resize).observe(fit);
  resize();
  setFloorClasses(3);
})();
</script>
</body>
</html>
